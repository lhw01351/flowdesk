# 의도적으로 비활성 (공개 저장소 + self-hosted runner 보안 위험)
# 배포는 WSL에서: bash scripts/deploy-wsl.sh
# 자세한 내용: docs/CI_CD.md
#
# Self-hosted CD가 필요하면:
# 1) 저장소를 Private로 바꾸거나 배포 전용 private repo를 쓰고
# 2) fork PR이 러너를 쓰지 않도록 워크플로를 제한한 뒤
# 3) 이 파일을 복구해 사용하세요.
name: CD Deploy (disabled)

on:
  workflow_dispatch:

jobs:
  notice:
    name: Use local deploy-wsl.sh instead
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "Public repo: do NOT attach a self-hosted runner for CD."
          echo "Deploy on your PC/WSL with: bash scripts/deploy-wsl.sh"
          echo "See docs/CI_CD.md"
          exit 1
