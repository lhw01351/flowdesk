# CI: push / PR 시 Maven 빌드 검증 (GitHub 클라우드 러너)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Maven package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build WAR
        run: mvn -B -DskipTests package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowdesk-war
          path: target/flowdesk.war
          if-no-files-found: error
          retention-days: 7
