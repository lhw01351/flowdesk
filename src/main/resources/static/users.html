<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 · FlowDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/profile-crop.css">
<style>
  .users-layout { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 960px) { .users-layout { grid-template-columns: 1fr; } }
  .role-tag {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
    background: #EEF0F6; color: #4A4D63;
  }
  .role-tag.a01 { background: #E8F1FF; color: #1D5BBF; }
  .role-tag.a02 { background: #F5F0E8; color: #8A6A2F; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions button { font-size: 12px; padding: 4px 10px; }
  .form-hint { font-size: 11px; color: var(--text-ter); margin-top: 4px; }
  .form-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .err {
    display: none; margin-top: 10px; padding: 10px 12px; background: var(--danger-light);
    color: var(--danger); border-radius: 8px; font-size: 12px; font-weight: 500;
  }
  .err.show { display: block; }
  .ok-msg {
    display: none; margin-top: 10px; padding: 10px 12px; background: #E9F8EF;
    color: #1B7A45; border-radius: 8px; font-size: 12px; font-weight: 500;
  }
  .ok-msg.show { display: block; }
  .avatar-edit {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px;
  }
  .avatar-hit {
    border: none; padding: 0; background: transparent; cursor: pointer;
    border-radius: 50%; line-height: 0;
  }
  .avatar-preview {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    background: #EEF0F6; border: 1px solid rgba(20,22,36,0.1);
    display: none;
  }
  .avatar-preview.show { display: block; }
  .avatar-letter {
    width: 72px; height: 72px; border-radius: 50%;
    background: #D9DEEA; color: #3A4258; font-weight: 800; font-size: 22px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .avatar-letter.hide { display: none; }
</style>
</head>
<body data-page="users">
<header class="fd-header">
  <div class="fd-header-label">USERS</div>
  <div class="fd-header-title">회원 관리</div>
  <div class="fd-header-sub" id="headerSub">계정 등록 및 권한 부여 (권한 01)</div>
</header>

<div class="fd-content">
  <div class="users-layout">
    <div class="fd-card">
      <div class="fd-card-title" id="formTitle">회원 등록</div>
      <div class="fd-card-desc">권한코드 부여 (01 전체관리자 / 02 일반사용자)</div>
      <form id="userForm">
        <input type="hidden" id="editId" value="">
        <div class="fd-field">
          <label>아이디 <span class="req">*</span></label>
          <input type="text" id="username" autocomplete="off" required>
        </div>
        <div class="fd-field">
          <label>비밀번호 <span class="req" id="pwReq">*</span></label>
          <input type="password" id="password" autocomplete="new-password">
          <div class="form-hint" id="pwHint">신규 등록 시 필수</div>
        </div>
        <div class="fd-field">
          <label>표시 이름</label>
          <input type="text" id="displayName" autocomplete="off">
        </div>
        <div class="fd-field">
          <label>권한 <span class="req">*</span></label>
          <select id="authCd"></select>
        </div>
        <div class="fd-field">
          <label>메모</label>
          <input type="text" id="note" autocomplete="off">
        </div>
        <div class="fd-field" id="avatarField" style="display:none">
          <label>프로필 사진</label>
          <div class="avatar-edit">
            <button type="button" class="avatar-hit" id="btnAvatarHit" title="프로필 사진 변경">
              <img class="avatar-preview" id="avatarPreview" alt="프로필">
              <span class="avatar-letter" id="avatarLetter">?</span>
            </button>
            <div>
              <button type="button" class="fd-btn fd-btn-primary" id="btnUploadAvatar">프로필 사진 변경</button>
              <div class="form-hint">원형 영역에 맞춰 자르기 · 드래그·확대축소 후 확인</div>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="fd-btn fd-btn-primary" id="btnSave">등록</button>
          <button type="button" class="fd-btn" id="btnReset">초기화</button>
        </div>
        <div class="err" id="errBox"></div>
        <div class="ok-msg" id="okBox"></div>
      </form>
    </div>

    <div class="fd-card">
      <div class="fd-card-title">등록된 회원</div>
      <div class="fd-card-desc" id="listDesc">-</div>
      <div style="overflow-x:auto">
        <table class="fd-table">
          <thead>
            <tr>
              <th>아이디</th><th>이름</th><th>권한</th><th>등록일</th><th>메모</th><th></th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div id="listPager"></div>
    </div>
  </div>
</div>

<script src="js/app-shell.js"></script>
<script src="js/profile-crop.js"></script>
<script>
(function () {
  var editingId = null, authList = [];
  var PAGE_SIZE = 15, listPage = 1, allUsers = [];

  function showErr(msg) {
    var e = document.getElementById('errBox'), o = document.getElementById('okBox');
    o.classList.remove('show'); e.textContent = msg || ''; e.classList.toggle('show', !!msg);
  }
  function showOk(msg) {
    var e = document.getElementById('errBox'), o = document.getElementById('okBox');
    e.classList.remove('show'); o.textContent = msg || ''; o.classList.toggle('show', !!msg);
  }

  function fillAuthSelect(selected) {
    var sel = document.getElementById('authCd');
    sel.innerHTML = authList.map(function (a) {
      return '<option value="' + cxEscapeHtml(a.authCd) + '">' +
        cxEscapeHtml(a.authCd) + ' · ' + cxEscapeHtml(a.authNm) + '</option>';
    }).join('');
    if (selected) sel.value = selected;
    else if (authList.length) sel.value = authList[0].authCd;
  }

  function avatarUrlOf(u) {
    if (!u || !u.avatarUrl) return '';
    var url = String(u.avatarUrl);
    var base = typeof CX_APP_BASE !== 'undefined' ? CX_APP_BASE : '';
    if (url.indexOf('http') === 0 || (base && url.indexOf(base) === 0)) return url;
    return base + url;
  }

  function setAvatarPreview(u) {
    var field = document.getElementById('avatarField');
    var img = document.getElementById('avatarPreview');
    var letter = document.getElementById('avatarLetter');
    if (!editingId) {
      field.style.display = 'none';
      return;
    }
    field.style.display = '';
    var src = avatarUrlOf(u);
    var initial = ((u && (u.displayName || u.username)) || '?').trim().charAt(0).toUpperCase() || '?';
    letter.textContent = initial;
    if (src) {
      img.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
      img.classList.add('show');
      letter.classList.add('hide');
    } else {
      img.removeAttribute('src');
      img.classList.remove('show');
      letter.classList.remove('hide');
    }
  }

  async function uploadCroppedAvatar(blob) {
    if (!editingId) {
      showErr('회원을 먼저 저장한 뒤 프로필 사진을 변경하세요.');
      return;
    }
    showErr('');
    var fd = new FormData();
    fd.append('file', blob, 'profile.jpg');
    var res = await cxApiFetch(FD_USERS_BASE + '/' + encodeURIComponent(editingId) + '/avatar', {
      method: 'POST',
      body: fd
    });
    var body = {};
    try { body = await res.json(); } catch (err) {}
    if (!res.ok) {
      showErr(body.message || '프로필 사진 업로드에 실패했습니다.');
      return;
    }
    showOk('프로필 사진이 저장되었습니다. 상단 유저 영역에 반영됩니다.');
    await load();
    var found = allUsers.filter(function (x) { return x.id === editingId; })[0];
    if (found) setAvatarPreview(found);
  }

  function openAvatarCrop() {
    if (!editingId) {
      showErr('회원을 먼저 저장한 뒤 프로필 사진을 변경하세요.');
      return;
    }
    showErr('');
    openProfileCrop({
      onConfirm: function (blob) {
        uploadCroppedAvatar(blob);
      }
    });
  }

  function resetForm() {
    editingId = null;
    document.getElementById('editId').value = '';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('displayName').value = '';
    document.getElementById('note').value = '';
    fillAuthSelect('02');
    document.getElementById('formTitle').textContent = '회원 등록';
    document.getElementById('btnSave').textContent = '등록';
    document.getElementById('pwReq').style.display = '';
    document.getElementById('pwHint').textContent = '신규 등록 시 필수';
    setAvatarPreview(null);
    showErr(''); showOk('');
  }

  function fillEdit(u) {
    editingId = u.id;
    document.getElementById('editId').value = u.id;
    document.getElementById('username').value = u.username || '';
    document.getElementById('password').value = '';
    document.getElementById('displayName').value = u.displayName || '';
    document.getElementById('note').value = u.note || '';
    fillAuthSelect(u.authCd || '02');
    document.getElementById('formTitle').textContent = '회원 수정';
    document.getElementById('btnSave').textContent = '저장';
    document.getElementById('pwReq').style.display = 'none';
    document.getElementById('pwHint').textContent = '비워 두면 기존 비밀번호 유지';
    setAvatarPreview(u);
    showErr(''); showOk('');
  }

  async function loadAuths() {
    var res = await cxApiFetch(FD_AUTH_BASE);
    authList = await res.json();
    fillAuthSelect('02');
  }

  async function load() {
    var res = await cxApiFetch(FD_USERS_BASE);
    if (!res.ok) throw new Error('목록 조회 실패');
    allUsers = await res.json();
    if (!Array.isArray(allUsers)) allUsers = [];
    listPage = 1;
    document.getElementById('headerSub').textContent = '등록 ' + allUsers.length + '명 · 전체관리자(01)';
    document.getElementById('listDesc').textContent = allUsers.length + '명';
    renderTable();
  }

  function renderTable() {
    var body = document.getElementById('listBody');
    if (!allUsers.length) {
      body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#9B9DB0;padding:32px">등록된 회원이 없습니다.</td></tr>';
      fdRenderPager('listPager', 1, 1, null, { total: 0 });
      return;
    }
    var slice = fdPageSlice(allUsers, listPage, PAGE_SIZE);
    listPage = slice.page;
    body.innerHTML = slice.items.map(function (u) {
      var cd = u.authCd || '';
      var label = (cd ? cd + ' ' : '') + (u.authNm || u.role || '-');
      var cls = cd === '01' ? 'a01' : 'a02';
      return '<tr>' +
        '<td><strong>' + cxEscapeHtml(u.username) + '</strong></td>' +
        '<td>' + cxEscapeHtml(u.displayName || '-') + '</td>' +
        '<td><span class="role-tag ' + cls + '">' + cxEscapeHtml(label) + '</span></td>' +
        '<td class="fd-mono">' + cxEscapeHtml(u.createdAt || '-') + '</td>' +
        '<td>' + cxEscapeHtml(u.note || '-') + '</td>' +
        '<td><div class="row-actions">' +
          '<button type="button" class="fd-btn fd-btn-primary" data-login="' + cxEscapeHtml(u.id) + '" data-name="' + cxEscapeHtml(u.username) + '">로그인</button>' +
          '<button type="button" class="fd-btn" data-edit="' + cxEscapeHtml(u.id) + '">수정</button>' +
          '<button type="button" class="fd-btn" data-del="' + cxEscapeHtml(u.id) + '" data-name="' + cxEscapeHtml(u.username) + '">삭제</button>' +
        '</div></td></tr>';
    }).join('');

    body.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-edit');
        var found = allUsers.filter(function (x) { return x.id === id; })[0];
        if (found) fillEdit(found);
      });
    });
    body.querySelectorAll('[data-login]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-login');
        var name = btn.getAttribute('data-name');
        if (!confirm('"' + name + '" 계정으로 로그인할까요?\n현재 세션이 해당 사용자로 전환됩니다.')) return;
        var r = await cxApiFetch(FD_USERS_BASE + '/' + encodeURIComponent(id) + '/login', { method: 'POST' });
        var j = {};
        try { j = await r.json(); } catch (e) {}
        if (!r.ok || !j.ok) {
          showErr(j.message || '로그인에 실패했습니다.');
          return;
        }
        window.location.href = (typeof CX_APP_BASE !== 'undefined' ? CX_APP_BASE : '') + '/home.html';
      });
    });
    body.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-del');
        var name = btn.getAttribute('data-name');
        if (!confirm('"' + name + '" 계정을 삭제할까요?')) return;
        var r = await cxApiFetch(FD_USERS_BASE + '/' + encodeURIComponent(id), { method: 'DELETE' });
        if (r.status === 204) {
          if (editingId === id) resetForm();
          showOk('삭제되었습니다.');
          await load();
          return;
        }
        var j = {};
        try { j = await r.json(); } catch (e) {}
        showErr(j.message || '삭제에 실패했습니다.');
      });
    });

    fdRenderPager('listPager', slice.page, slice.pages, function (p) {
      listPage = p;
      renderTable();
      body.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, { total: slice.total, size: PAGE_SIZE });
  }

  document.getElementById('btnReset').addEventListener('click', resetForm);
  document.getElementById('btnUploadAvatar').addEventListener('click', openAvatarCrop);
  document.getElementById('btnAvatarHit').addEventListener('click', openAvatarCrop);
  document.getElementById('userForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    showErr('');
    var payload = {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
      displayName: document.getElementById('displayName').value.trim(),
      authCd: document.getElementById('authCd').value,
      note: document.getElementById('note').value.trim()
    };
    if (!payload.username) { showErr('아이디를 입력해주세요.'); return; }
    if (!editingId && !payload.password) { showErr('비밀번호를 입력해주세요.'); return; }

    var url = FD_USERS_BASE, method = 'POST';
    if (editingId) {
      url = FD_USERS_BASE + '/' + encodeURIComponent(editingId);
      method = 'PUT';
      if (!payload.password) delete payload.password;
    }
    var res = await cxApiFetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var body = {};
    try { body = await res.json(); } catch (err) {}
    if (!res.ok) { showErr(body.message || '저장에 실패했습니다.'); return; }
    resetForm();
    showOk(method === 'POST' ? '등록되었습니다.' : '저장되었습니다.');
    await load();
  });

  document.addEventListener('DOMContentLoaded', async function () {
    try {
      await cxRequireAuth();
      await loadAuths();
      resetForm();
      await load();
    } catch (e) { console.error(e); }
  });
})();
</script>
</body>
</html>
